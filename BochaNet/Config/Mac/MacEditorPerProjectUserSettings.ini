[/Script/UnrealEd.EditorLoadingSavingSettings]
; Epic's engine-shipped default (Engine/Config/Mac/MacEditorPerProjectUserSettings.ini)
; points this at the bare name "p4merge.app", which never resolves to a runnable
; binary on a stock Mac and pops a blocking "diff tool could not be run" dialog on
; every asset diff. For asset types with no built-in visual diff (Levels and most
; non-Blueprint assets), this is the ONLY diff UI Unreal shows - it exports both
; versions to text and hands off to this external tool, so it must point at a real
; diff viewer or the diff appears to silently fail. opendiff/FileMerge ships with
; Xcode Command Line Tools, already required to build UE projects on Mac.
TextDiffToolPath=(FilePath="/usr/bin/opendiff")
